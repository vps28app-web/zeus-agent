name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test npm installer
        run: npm run test:installer

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check zeus tests

      - name: Test with pytest
        run: python -m pytest tests/ -q --tb=short

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build sandbox
        working-directory: ./sandbox
        run: go build ./...

      - name: Test sandbox
        working-directory: ./sandbox
        run: go test ./...

  sandbox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run privileged sandbox integration test
        working-directory: ./sandbox
        run: sudo env "PATH=$PATH" go test ./internal/runner -run '^TestSandboxExecutionIsIsolated$' -v -count=1
