[package]
name = "zeus-desktop"
version = "0.1.0"
description = "Zeus Desktop - Interface gráfica para Zeus Agent"
authors = ["Valdeir Pereira da Silva"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
