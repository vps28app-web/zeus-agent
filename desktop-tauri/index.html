<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeus Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .status {
      font-size: 12px;
      color: #4ecca3;
      padding: 4px 12px;
      background: #0f3460;
      border-radius: 12px;
    }
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 200px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 12px;
    }
    .project-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }
    .project-item:hover { background: #0f3460; }
    .project-item.active { background: #4ecca3; color: #1a1a2e; }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
    }
    .message.user {
      background: #4ecca3;
      color: #1a1a2e;
      margin-left: auto;
    }
    .message.zeus {
      background: #0f3460;
      color: #eee;
    }
    .message.error {
      background: #e74c3c;
      color: white;
    }
    .input-area {
      padding: 16px 20px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 12px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: #4ecca3; }
    .input-area button {
      padding: 12px 24px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-area button:hover { opacity: 0.9; }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #4ecca3;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Zeus Desktop</h1>
    <span class="status" id="status">Pronto</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3>Projetos</h3>
      <div id="projects"></div>
    </div>

    <div class="chat-container">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="input" placeholder="Digite sua mensagem..." />
        <button id="send" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
